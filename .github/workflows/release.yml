name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build macOS installers
        run: pnpm --filter @clipsync/desktop run dist:mac -- --publish never
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          # 未配置 Apple Developer ID 时跳过签名；配置证书后改为 true 并补充签名 secrets
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
          generate_release_notes: true

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm --filter @clipsync/desktop run dist:win -- --publish never
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
          generate_release_notes: true
