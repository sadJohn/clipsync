appId: com.clipsync.app
productName: ClipSync
copyright: Copyright © 2026 ClipSync

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - resources/**/*
  - package.json

asar: true

# better-sqlite3 是原生模块，必须解包到 asar 外才能被主进程加载
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

npmRebuild: true

# electron-updater 通过 GitHub Releases 的 latest*.yml 元数据检查更新
publish:
  provider: github
  owner: sadJohn
  repo: clipsync

mac:
  category: public.app-category.productivity
  icon: resources/icon-1024.png
  target:
    - target: dmg
    - target: zip

dmg:
  title: ${productName}

win:
  icon: resources/icon-1024.png
  # 默认名含空格，GitHub 上传时会把空格转成点，导致 latest.yml 里的地址 404
  artifactName: ${productName}-Setup-${version}.${ext}
  target:
    - target: nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  icon: resources/icon-1024.png
  category: Utility
  target:
    - AppImage
