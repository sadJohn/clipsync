packages:
  - "apps/*"
  - "packages/*"

# 允许执行原生依赖的安装脚本（pnpm 10+ 默认拦截）
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  electron: true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.23"
  - "@better-auth/drizzle-adapter@1.7.23"
  - "@better-auth/kysely-adapter@1.7.23"
  - "@better-auth/memory-adapter@1.7.23"
  - "@better-auth/mongo-adapter@1.7.23"
  - "@better-auth/prisma-adapter@1.7.23"
  - "@better-auth/telemetry@1.7.23"
  - "@nestjs/cli@12.0.13"
  - better-auth@1.7.23
  - better-sqlite3@13.2.0
  - electron@45.3.2
